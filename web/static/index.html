<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar Office</title>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f23; --muted: #6b6f76; --line: #e3e1da;
    --accent: #2f5d50; --accent-ink: #ffffff; --soft: #eef3f1; --warn: #a2401f;
    --records: #3b6ea5; --registration: #2f7d5b; --analytics: #8a5a12; --advising: #7a4a8c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181b; --panel: #1f2226; --ink: #e8e6e1; --muted: #9a9ea6; --line: #33373d;
      --accent: #7fb8a4; --accent-ink: #10201b; --soft: #24302c; --warn: #e48a68;
      --records: #8fb6e0; --registration: #86c9a8; --analytics: #e0b56a; --advising: #c79bd8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .who { margin-left: auto; color: var(--muted); font-size: 14px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); padding: 7px 12px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); width: 100%; }
  .hidden { display: none !important; }

  #login { max-width: 440px; margin: 8vh auto; padding: 28px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; }
  #login h2 { margin: 0 0 4px; } #login p { color: var(--muted); margin: 0 0 20px; }
  #login label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  #login .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  #login .error { color: var(--warn); font-size: 14px; margin-top: 12px; min-height: 1em; }
  #login button { width: 100%; margin-top: 20px; padding: 10px; }

  #chat { display: flex; flex-direction: column; height: calc(100vh - 56px); max-width: 900px; margin: 0 auto; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .msg { margin: 0 0 18px; }
  .user { margin-left: auto; max-width: 80%; width: fit-content; background: var(--accent);
    color: var(--accent-ink); padding: 9px 14px; border-radius: 14px 14px 4px 14px; }
  .bot { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  .bot table { border-collapse: collapse; margin: 8px 0; font-size: 14px; display: block; overflow-x: auto; }
  .bot th, .bot td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
  .bot th { background: var(--soft); }
  .bot p:first-child { margin-top: 0; } .bot p:last-child { margin-bottom: 0; }
  .trace { font-size: 13px; color: var(--muted); margin: 0 0 8px; border-left: 2px solid var(--line); padding-left: 10px; }
  .trace .step { margin: 3px 0; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-weight: 600; font-size: 12px;
    color: var(--panel); background: var(--muted); }
  .chip.records { background: var(--records); } .chip.registration { background: var(--registration); }
  .chip.analytics { background: var(--analytics); } .chip.advising { background: var(--advising); }
  .tool { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .thinking::after { content: "…"; animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .2; } }

  #suggest { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
  #suggest button { font-size: 13px; padding: 5px 10px; border-radius: 99px; background: var(--soft); }
  form#send { display: flex; gap: 8px; padding: 12px 16px 18px; border-top: 1px solid var(--line); }
  form#send input { flex: 1; }
  label.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  label.toggle input { width: auto; }
  @media (max-width: 600px) { header .who { display: none; } .user { max-width: 92%; } }
</style>
</head>
<body>
<header>
  <h1>Agentic AI Registrar Office</h1>
  <span class="who" id="who"></span>
  <button id="logout" class="hidden">Log out</button>
</header>

<section id="login">
  <h2>Sign in</h2>
  <p>Choose who you are. Each role sees only what it is allowed to.</p>
  <label for="role">Role</label>
  <select id="role">
    <option value="student">Student</option>
    <option value="professor">Professor</option>
    <option value="advisor">Advisor</option>
    <option value="admin">Administrator</option>
  </select>
  <div id="idbox">
    <label for="uid">ID</label>
    <input id="uid" placeholder="e.g. S1001" autocomplete="off">
    <div class="hint" id="hint"></div>
  </div>
  <button class="primary" id="go">Sign in</button>
  <div class="error" id="err"></div>
</section>

<section id="chat" class="hidden">
  <div id="log"></div>
  <div id="suggest"></div>
  <form id="send">
    <input id="q" placeholder="Ask the registrar…" autocomplete="off">
    <label class="toggle"><input type="checkbox" id="showtools"> tool calls</label>
    <button class="primary" id="sendbtn">Send</button>
  </form>
</section>

<script>
const $ = id => document.getElementById(id);
const SUGGEST = {
  student: ["Show my transcript", "What is my schedule this semester?", "Am I on track to graduate?",
            "What should I take next semester?"],
  professor: ["What am I teaching this semester?", "Show my class rosters", "How are grades in my courses historically?"],
  advisor: ["List my advisees", "Which of my advisees are at risk?", "Who needs to register for next semester?"],
  admin: ["Which students are on the brink of dismissal?", "Who will graduate?",
          "Grade distribution across CS courses", "Which courses give a lot of As or Fs?"],
};
let info = null, token = null, ws = null, current = null;

function render(md) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md));
  const d = document.createElement("div"); d.textContent = md; return d.innerHTML.replace(/\n/g, "<br>");
}
function updateHint() {
  const role = $("role").value;
  $("idbox").classList.toggle("hidden", role === "admin");
  if (!info) return;
  const h = {
    student: "Try: " + info.sample_students.slice(0, 4).map(s => `${s.id} (${s.name})`).join(", "),
    professor: info.professors.map(p => `${p.id} ${p.name}`).join(" · "),
    advisor: "Advisors: " + info.professors.filter(p => info.advisors.includes(p.id)).map(p => `${p.id} ${p.name}`).join(" · "),
  }[role] || "";
  $("hint").textContent = h;
  $("uid").placeholder = role === "student" ? "e.g. S1001" : "e.g. P01";
}
fetch("/api/info").then(r => r.json()).then(d => { info = d; updateHint(); });
$("role").onchange = updateHint;
$("uid").onkeydown = e => { if (e.key === "Enter") $("go").click(); };

$("go").onclick = async () => {
  $("err").textContent = ""; $("go").disabled = true; $("go").textContent = "Starting agents…";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ role: $("role").value, id: $("uid").value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "Login failed");
    token = d.token;
    $("who").textContent = `${d.name} · ${d.role}${d.id ? " · " + d.id : ""}`;
    $("login").classList.add("hidden"); $("chat").classList.remove("hidden"); $("logout").classList.remove("hidden");
    $("suggest").innerHTML = "";
    for (const s of SUGGEST[d.role]) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = s;
      b.onclick = () => ask(s); $("suggest").appendChild(b);
    }
    addBot(`Hello ${d.name}. I'm the Registrar. ${info ? `It's ${info.current}; registration is open for ${info.registration}.` : ""} How can I help?`);
    openSocket();
    $("q").focus();
  } catch (e) { $("err").textContent = e.message; }
  $("go").disabled = false; $("go").textContent = "Sign in";
};

$("logout").onclick = async () => {
  if (ws) ws.close();
  await fetch(`/api/logout/${token}`, { method: "POST" });
  token = null; $("log").innerHTML = "";
  $("chat").classList.add("hidden"); $("logout").classList.add("hidden"); $("login").classList.remove("hidden");
  $("who").textContent = "";
};

function openSocket() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/${token}`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { if (current) finish(); };
}

function addBot(md) {
  const d = document.createElement("div"); d.className = "msg bot"; d.innerHTML = render(md);
  $("log").appendChild(d); scroll(); return d;
}
function scroll() { $("log").scrollTop = $("log").scrollHeight; }

function ask(text) {
  if (!text.trim() || current || !ws || ws.readyState !== 1) return;
  const u = document.createElement("div"); u.className = "msg user"; u.textContent = text; $("log").appendChild(u);
  const wrap = document.createElement("div"); wrap.className = "msg";
  const trace = document.createElement("div"); trace.className = "trace";
  const status = document.createElement("div"); status.className = "step thinking"; status.textContent = "Registrar is working";
  trace.appendChild(status); wrap.appendChild(trace); $("log").appendChild(wrap);
  current = { wrap, trace, status, answers: [] };
  ws.send(JSON.stringify({ message: text }));
  $("q").value = ""; $("sendbtn").disabled = true; scroll();
}
$("send").onsubmit = e => { e.preventDefault(); ask($("q").value); };

function step(html, cls = "") {
  const s = document.createElement("div"); s.className = "step " + cls; s.innerHTML = html;
  current.trace.insertBefore(s, current.status); scroll();
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function handle(ev) {
  if (ev.type === "error") { addBot(`**${esc(ev.text)}**`); return; }
  if (!current) return;
  if (ev.type === "delegate") step(`→ delegated to <span class="chip ${esc(ev.agent)}">${esc(ev.agent)}</span> ${esc(ev.description)}`);
  else if (ev.type === "tool" && $("showtools").checked)
    step(`<span class="tool">${esc(ev.agent)} · ${esc(ev.name)}(${esc(JSON.stringify(ev.input))})</span>`);
  else if (ev.type === "answer") current.answers.push(ev.text);
  else if (ev.type === "done") finish(ev);
}
function finish(ev) {
  current.status.remove();
  if (!current.trace.children.length) current.trace.remove();
  const d = document.createElement("div"); d.className = "bot";
  d.innerHTML = render(current.answers.join("\n\n") || "_No answer was returned._");
  if (ev && ev.cost != null) {
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = `${ev.seconds}s · $${ev.cost.toFixed(4)}`; d.appendChild(m);
  }
  current.wrap.appendChild(d); current = null; $("sendbtn").disabled = false; scroll(); $("q").focus();
}
</script>
</body>
</html>
